<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Categories - Smart Study Planner</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
	<header class="page-header">
		<h1>Smart Study Planner</h1>
		<nav>
			<a th:href="@{/}">Home</a>
			<a th:href="@{/categories}">Categories</a>
			<a th:href="@{/tasks}">Tasks</a>
		</nav>
	</header>

	<main class="container">
		<div class="page-title">
			<h2>Categories</h2>
			<a class="button" th:href="@{/categories/new}">Create Category</a>
		</div>

		<div class="alert error-alert" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

		<table class="table">
			<thead>
				<tr>
					<th>Name</th>
					<th>Description</th>
					<th>Actions</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="category : ${categories}">
					<td th:text="${category.name}">Category name</td>
					<td th:text="${category.description}">Description</td>
					<td class="actions">
						<a th:href="@{/categories/{id}/edit(id=${category.id})}">Edit</a>
						<form th:action="@{/categories/{id}/delete(id=${category.id})}" method="post">
							<button type="submit" class="link-button">Delete</button>
						</form>
					</td>
				</tr>
				<tr th:if="${#lists.isEmpty(categories)}">
					<td colspan="3">No categories available yet.</td>
				</tr>
			</tbody>
		</table>
	</main>
</body>
</html>
